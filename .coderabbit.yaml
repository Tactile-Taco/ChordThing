reviews:
  review_status: true
  auto_review:
    enabled: true
    branches:
      - main
      - datastar-axum-vite
      - feature/**
    drafts: false
  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!**/target/**"
    - "!**/dist/**"
  path_instructions:
    - path: "backend/**/*.rs"
      instructions: "Review Rust code for safety, performance, and idiomatic patterns. Check for proper error handling and async/await usage."
    - path: "frontend/**/*.ts"
      instructions: "Review TypeScript code for type safety, proper use of strict settings, and test coverage. Ensure CCOS protocol references are accurate."
    - path: "e2e/**/*.ts"
      instructions: "Review Playwright tests for reliability, proper selectors, and meaningful assertions."
  tools:
    languagetool:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
  poem: false
  collapse_walkthrough: false
