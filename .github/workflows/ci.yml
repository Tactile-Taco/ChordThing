name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.3.13

      - name: Rust lint
        run: |
          cd backend
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cd backend
          cargo audit

      - name: TypeScript type check
        run: |
          cd frontend
          bun install
          bunx tsc --noEmit

  build-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build backend (release)
        run: |
          cd backend
          cargo build --release

      - name: Upload backend binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-release
          path: backend/target/release/chordthing-backend
          retention-days: 1

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run tests
        run: |
          cd backend
          cargo test

  test-frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          cd frontend
          bun install

      - name: Run Vitest
        run: |
          cd frontend
          bunx vitest run

  test-e2e:
    runs-on: ubuntu-latest
    needs: [build-backend, test-frontend]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@db6bcf6eb8d88a8aa03265b887ec7bd84d64cd68 # v2.1.1
        with:
          bun-version: 1.3.13

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@c430123403805636d9e8bd410bdf69ee52750230 # v1.2.0
        with:
          node-version: '24'
          cache: true

      - name: Build frontend
        run: |
          cd frontend
          vp install
          vp build

      - name: Download backend binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: backend-release
          path: backend/target/release/

      - name: Make backend executable
        run: chmod +x backend/target/release/chordthing-backend

      - name: Run Playwright tests
        run: |
          cd e2e
          bun install
          bunx playwright install chromium
          bunx playwright test
