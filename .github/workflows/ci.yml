name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Rust lint
        run: |
          cd backend
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Cargo audit
        run: |
          cargo install cargo-audit
          cd backend
          cargo audit

      - name: TypeScript type check
        run: |
          cd frontend
          bun install
          bunx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          cd backend
          cargo test

  test-frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: |
          cd frontend
          bun install

      - name: Run Vitest
        run: |
          cd frontend
          bunx vitest run

  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build frontend
        run: |
          cd frontend
          bun install
          bunx vite-plus build

      - name: Build backend
        run: |
          cd backend
          cargo build --release

      - name: Start backend
        run: |
          cd backend
          cargo run --release &
          sleep 5

      - name: Run Playwright tests
        run: |
          cd e2e
          npx playwright test
