name: Weekly Mutation Testing

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  backend-mutants:
    name: Backend Mutation Testing (cargo-mutants)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run cargo-mutants
        run: cd backend && cargo mutants

      - name: Upload cargo-mutants results
        uses: actions/upload-artifact@v4
        with:
          name: cargo-mutants-results
          path: backend/mutants.out/
          if-no-files-found: warn

  frontend-stryker:
    name: Frontend Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install frontend dependencies
        run: cd frontend && bun install

      - name: Install Stryker deps
        run: cd frontend && bun add -d @stryker-mutator/core @stryker-mutator/vitest-runner

      - name: Run Stryker
        run: cd frontend && npx stryker run

      - name: Upload Stryker results
        uses: actions/upload-artifact@v4
        with:
          name: stryker-results
          path: frontend/reports/
          if-no-files-found: warn
