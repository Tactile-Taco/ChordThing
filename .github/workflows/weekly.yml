name: Weekly Mutation Testing

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-mutants:
    name: Backend Mutation Testing (cargo-mutants)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Run cargo-mutants
        run: cd backend && cargo mutants

      - name: Upload cargo-mutants results
        uses: actions/upload-artifact@v4
        with:
          name: cargo-mutants-results
          path: backend/mutants.out/
          if-no-files-found: warn

  frontend-stryker:
    name: Frontend Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install frontend dependencies
        run: cd frontend && bun install

      - name: Install Stryker deps
        run: cd frontend && bun add -d @stryker-mutator/core @stryker-mutator/vitest-runner

      - name: Run Stryker
        run: cd frontend && npx stryker run

      - name: Upload Stryker results
        uses: actions/upload-artifact@v4
        with:
          name: stryker-results
          path: frontend/reports/
          if-no-files-found: warn

  evidence-chain:
    name: Generate Evidence Chain
    runs-on: ubuntu-latest
    needs: [backend-mutants, frontend-stryker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Stryker results
        uses: actions/download-artifact@v4
        with:
          name: stryker-results
          path: frontend/reports/

      - name: Download cargo-mutants results
        uses: actions/download-artifact@v4
        with:
          name: cargo-mutants-results
          path: backend/mutants.out/

      - name: Generate evidence chain
        run: python3 scripts/generate-evidence-chain.py

      - name: Upload evidence chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-chain
          path: |
            evidence-chain.md
            evidence-chain.json
          if-no-files-found: warn

      - name: Post PR comment with mutation summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('evidence-chain.md', 'utf8');
            // Truncate if too large for a PR comment
            const body = md.length > 65000
              ? md.substring(0, 65000) + '\n\n_(truncated)_'
              : md;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Mutation Testing Evidence Chain\n\n' + body,
            });
